server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors the registry frontend). The CSP uses a per-request
    # nonce: index.html ships a `__CSP_NONCE__` placeholder that main.tsx feeds to
    # emotion's cache; sub_filter swaps it for nginx's $request_id so injected
    # styles satisfy the policy. (In k8s the chart's ConfigMap nginx applies the
    # same block.)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    set $csp_nonce $request_id;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$csp_nonce'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    sub_filter_once on;
    sub_filter '__CSP_NONCE__' '$csp_nonce';

    # Proxy API + probe endpoints to the backend service. "backend" resolves on the
    # Docker Compose network; override the upstream host as needed in other setups.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8080;
    }

    location = /ready {
        proxy_pass http://backend:8080;
    }

    # OpenAPI spec served by the backend (consumed by the API docs page).
    location ~ ^/swagger\.(json|yaml)$ {
        proxy_pass http://backend:8080;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
