server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Conservative default security headers (mirrors the registry frontend).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API + probe endpoints to the backend service. "backend" resolves on the
    # Docker Compose network; override the upstream host as needed in other setups.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8080;
    }

    location = /ready {
        proxy_pass http://backend:8080;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
