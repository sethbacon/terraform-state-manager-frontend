# zizmor configuration.
#
# An entry here is an ACCEPTED finding, not a silenced one: it names the rule,
# the file, and why the obvious remediation is wrong. Anything NOT listed fails
# the job, so a new finding of any kind is still caught.
rules:
  self-repository:
    ignore:
      # zizmor tips: rewrite in-repo references from `uses: ./...` to GitHub's
      # self-repository form, `uses: $/...`. That exact change cannot be made
      # here -- actionlint rejects `$/` outright: "not following the format
      # 'owner/repo/path/to/workflow.yml@ref' nor './path/to/workflow.yml'" --
      # and actionlint is a required check in this repository via
      # 4cloudguru/shared-workflows' workflow-security gate. This was proven,
      # not assumed: the conversion was tried in 4cloudguru/shared-workflows#46,
      # where `$/` resolved correctly at runtime and actionlint failed it anyway.
      #
      # Support is requested in rhysd/actionlint#711, still open. Until it
      # lands, applying the remediation trades a lint improvement for a broken
      # required gate. Tracked in 4cloudguru/shared-workflows#45.
      - ci.yml
      - weekly-security.yml
