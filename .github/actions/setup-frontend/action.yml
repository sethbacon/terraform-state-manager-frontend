---
name: Setup frontend
description: >-
  Node.js + npm cache and dependency install shared across frontend workflows.
  The calling job must run actions/checkout first — this action does not check out.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: "24"
  install-deps:
    description: Run `npm ci` in frontend/.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      if: inputs.install-deps == 'true'
      working-directory: frontend
      shell: bash
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: npm ci
