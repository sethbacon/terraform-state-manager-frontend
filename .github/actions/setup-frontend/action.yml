---
name: Setup frontend
description: >-
  Node.js + npm cache and dependency install shared across frontend workflows.
  The calling job must run actions/checkout first — this action does not check out.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: "24"
  install-deps:
    description: Run `npm ci` in frontend/.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      if: inputs.install-deps == 'true'
      working-directory: frontend
      shell: bash
      run: npm ci

    # The library publishes a SLSA provenance attestation bound to the packed tarball. Without
    # this, the attestation is an audit trail nobody reads; here it gates the build. Verified
    # locally before adding: a genuine tarball passes, and one with a single appended byte fails
    # with HTTP 404 for its altered digest.
    - name: Verify @4cloudguru/cloud-suite-ui provenance
      if: inputs.install-deps == 'true'
      working-directory: frontend
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version=$(node -p "require('./package.json').dependencies['@4cloudguru/cloud-suite-ui']")
        tmp=$(mktemp -d)
        tarball=$(basename "$(npm pack "@4cloudguru/cloud-suite-ui@${version}" --silent --pack-destination "$tmp" | tail -n1)")
        gh attestation verify "${tmp}/${tarball}" --repo 4cloudguru/cloud-suite-ui
        rm -rf "$tmp"
