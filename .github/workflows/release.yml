name: Release

# Publish the frontend Docker image (nginx + built SPA) to ghcr.io whenever a
# semver tag is pushed. release-please creates the tag and the GitHub release;
# this workflow builds + pushes the image for that tag. Mirrors
# terraform-registry-frontend's release.yml (the docker job), adapted for this
# repo (release-please already creates the GitHub release, so no release job).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/terraform-state-manager-frontend

jobs:
  # Releases must originate from main: verify the tagged commit is reachable
  # from origin/main (GitHub can't filter tag events by branch).
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history to walk ancestry
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${GITHUB_EVENT_INPUTS_TAG}"
            # The manual fallback (RELEASING.md) requires the operator to push the
            # real vX.Y.Z tag BEFORE dispatching. Verify it actually exists on the
            # remote rather than trusting the free-text input, so a made-up tag
            # string cannot be built, signed, and attested (#212).
            if ! git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"; then
              echo "::error::Tag ${TAG} does not exist on origin. Push the tag before dispatching."
              exit 1
            fi
            echo "value=${TAG}" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse "refs/tags/${TAG}^{commit}")" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Check tagged commit is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${STEPS_TAG_OUTPUTS_SHA}" origin/main; then
            echo "::error::Release tags must be pushed on main." \
                 "This ref points to a commit that is not in origin/main."
            exit 1
          fi
          echo "✅ Tag ${STEPS_TAG_OUTPUTS_VALUE} is on main — proceeding with release."
        env:
          STEPS_TAG_OUTPUTS_SHA: ${{ steps.tag.outputs.sha }}
          STEPS_TAG_OUTPUTS_VALUE: ${{ steps.tag.outputs.value }}

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # Sigstore OIDC (cosign keyless)
      attestations: write # SLSA provenance attestation
    steps:
      # Check out the released tag's commit specifically (for a workflow_dispatch
      # re-run this is the dispatched tag, not the branch head), so the built image
      # matches the tag it is published under (#212).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.version }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.guard.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.guard.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.guard.outputs.version }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image (load locally for the pre-push scan; no push yet)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend/
          file: frontend/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (pre-push gate)
        # Scan the built image BEFORE it is pushed, so a fixable HIGH/CRITICAL
        # blocks the release instead of only failing after the image is already
        # live (and pullable by tag, including latest) at ghcr.io (#207).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          severity: HIGH,CRITICAL
          # Only fail on vulnerabilities that have a fix available; un-actionable
          # (no-fix-yet) CVEs shouldn't block a release.
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Push image (only after the scan passes)
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend/
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuses the layers built and cached above, so this is a cache hit that
          # only exports the already-scanned image to the registry.
          cache-from: type=gha

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        run: cosign sign --yes "${{ env.REGISTRY }}/${IMAGE_NAME}@${STEPS_PUSH_OUTPUTS_DIGEST}"
        env:
          STEPS_PUSH_OUTPUTS_DIGEST: ${{ steps.push.outputs.digest }}
