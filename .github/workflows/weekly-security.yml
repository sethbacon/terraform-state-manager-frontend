name: Weekly Security Scan

# Complements the every-PR dependency-review in pr-checks.yml (which only sees a
# PR's own diff) by re-running the full CI plus full-dependency-tree scanners on a
# fixed weekly cadence, so a newly-disclosed CVE in an already-pinned, unchanged
# dependency is surfaced even when no code change triggers CI (#211). Findings open
# tracking issues.
on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Re-run the full CI suite (lint, typecheck, tests, build) on schedule.
  ci:
    name: CI
    permissions:
      contents: read
    # Not `secrets: inherit`, which hands the called workflow EVERY secret this
    # repository holds. ci.yml references exactly one.
    secrets:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    uses: ./.github/workflows/ci.yml

  # ── npm audit (production dependency tree) ────────────
  # Mirrors the release-time gate in frontend/Dockerfile, but on a schedule, so a
  # CVE newly disclosed against an already-shipped dependency is caught before the
  # next release rather than only at build time.
  npm-audit:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API and clones
      #   this repository; harden-runner has never run in this repository, so no
      #   endpoint baseline exists and a block policy written without one fails closed
      #   on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      # Same triage the image build uses (frontend/scripts/audit-gate.mjs): block
      # only on advisories that reach production AND have a non-breaking fix.
      # Accepted risks live in frontend/scripts/npm-audit-exceptions.json with a
      # rationale and a review date, so an advisory nobody can act on does not
      # open a fresh issue every Monday forever.
      - name: npm audit
        id: audit
        working-directory: frontend
        continue-on-error: true
        run: |
          npm audit --json --omit=dev > "$RUNNER_TEMP/frontend-audit.json" || true
          node scripts/audit-gate.mjs "$RUNNER_TEMP/frontend-audit.json" \
            --exceptions scripts/npm-audit-exceptions.json

      - name: Create issue on new vulnerabilities
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = 'npm audit: production vulnerabilities found';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security,dependencies',
            });
            if (open.some(i => i.title.startsWith(marker))) {
              core.info('An open npm-audit issue already exists — skipping duplicate.');
              return;
            }
            const title = `${marker} — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## npm audit Report',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '`npm audit --omit=dev --audit-level=high` found fixable high/critical advisories in the production dependency tree. Review the workflow logs and open a reviewed PR to update the affected package(s) (the lockfile is the shipped integrity record — see #213).',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['security', 'dependencies'],
            });

  # ── OSV Vulnerability Scan (full lockfile) ────────────
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — this job queries the OSV vulnerability
      #   database, calls the GitHub API, and clones this repository; harden-runner
      #   has never run in this repository, so no endpoint baseline exists and a block
      #   policy written without one fails closed on its first run; audit is what
      #   produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        continue-on-error: true
        with:
          # JSON so the triage step below can classify findings; it prints a
          # readable summary in place of the table.
          scan-args: |-
            --format=json
            --output=osv-results.json
            --lockfile=frontend/package-lock.json

      # DISTINGUISH A BROKEN SCANNER FROM A CLEAN ONE (#894).
      #
      # continue-on-error above collapses osv-scanner's exit 1 ("vulnerabilities
      # found") and its error exits -- 127 (general error) and 128 (no packages
      # found) -- into a single `outcome == 'failure'`, and GitHub exposes the
      # raw exit code nowhere. So "Create issue on new vulnerabilities" below
      # would file an issue TITLED "vulnerabilities found" for a scanner that
      # had simply stopped working, and the triage step would read the same run
      # as clean.
      #
      # Not hypothetical: terraform-state-manager-backend#334 filed exactly that
      # issue, asserting vulnerabilities that did not exist, while seven
      # genuinely reachable advisories stayed invisible.
      #
      # WHY THE JSON CANNOT BE TRUSTED ON ITS OWN. A scan that never reached the
      # OSV API still writes a syntactically valid `{"results": []}` -- which is
      # byte-identical to a clean scan. Only the pairing is contradictory:
      # osv-scanner's exit 1 always carries at least one finding, so
      # "failed AND found nothing" cannot be a real result.
      #
      # Runs BEFORE the triage gate, because that gate reads `{"results": []}`
      # as clean and would pass the job on a scan that never happened.
      #
      # FAILS THE RUN rather than warning. A permanently-red Monday for a broken
      # scanner is the notification; a silently green one is the defect, and the
      # whole point is that the two were indistinguishable.
      - name: Distinguish a broken scanner from real findings
        id: osv_verdict
        if: steps.osv.outcome == 'failure'
        run: |
          set -euo pipefail
          found=$(node -e '
            const fs = require("fs");
            let d;
            try { d = JSON.parse(fs.readFileSync("osv-results.json", "utf8")); }
            catch { process.stdout.write("0"); process.exit(0); }
            let n = 0;
            for (const r of d.results || [])
              for (const p of r.packages || [])
                n += (p.vulnerabilities || []).length;
            process.stdout.write(String(n));
          ')
          if [ "$found" -gt 0 ]; then
            echo "findings=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "findings=false" >> "$GITHUB_OUTPUT"
          echo "::error title=OSV-Scanner did not scan::osv-scanner exited non-zero but its results contain no vulnerabilities. Exit 1 always carries at least one, so this was a scanner error (127 general error, or 128 no packages found), NOT a clean scan and NOT a finding. Do not read this run as green -- fix the scanner. See #894."
          {
            echo '## ⚠️ OSV-Scanner did not complete'
            echo ''
            echo 'The scan step exited non-zero but reported no vulnerabilities.'
            echo 'This run tells you **nothing** about whether this repository has'
            echo 'known vulnerabilities.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Triaged through the same gate and the same exceptions file the npm-audit
      # job uses, so the two scanners cannot reach opposite conclusions about one
      # advisory. That matters here: OSV lists react-router's fix as 8.3.0, which
      # reads as "a fix exists", while npm audit correctly reports the same
      # advisory as fixable only by a breaking change. Without shared triage this
      # job would be red every week with no action anyone could take.
      - name: Triage OSV findings
        run: node frontend/scripts/audit-gate.mjs osv-results.json \
          --exceptions frontend/scripts/npm-audit-exceptions.json

      - name: Create issue on new vulnerabilities
        if: steps.osv.outcome == 'failure' && steps.osv_verdict.outputs.findings == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = 'OSV-Scanner: vulnerabilities found';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security,dependencies',
            });
            if (open.some(i => i.title.startsWith(marker))) {
              core.info('An open OSV-Scanner issue already exists — skipping duplicate.');
              return;
            }
            const title = `${marker} — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## OSV-Scanner Vulnerability Report',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'OSV-Scanner found known vulnerabilities in `frontend/package-lock.json`. Review the workflow logs and update the affected dependencies.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['security', 'dependencies'],
            });

  # ── CodeQL Analysis (JavaScript/TypeScript) ───────────
  codeql:
    name: CodeQL Analysis (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # CodeQL reads workflow-run metadata (required on private repos)
      contents: read
      security-events: write
    steps:
      # hardening-exception: egress-audit — this job downloads the CodeQL bundle and
      #   its query packs and clones this repository; harden-runner has never run in
      #   this repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:javascript-typescript

  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci, npm-audit, osv-scan, codeql]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      # hardening-exception: egress-audit — this job queries the OSV vulnerability
      #   database and calls the GitHub API; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Weekly security scan failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Weekly Security Scan Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The scheduled weekly security scan failed. Please investigate before the next release.',
              '',
              'Common causes:',
              '- A transitive npm dependency published a new CVE',
              '- The Docker base image (node/nginx) changed in a breaking way',
              '- An npm-audit or OSV-Scanner finding was introduced',
              '- CodeQL detected a new issue',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['bug', 'ci'],
            });
