name: Weekly Security Scan

# Complements the every-PR dependency-review in pr-checks.yml (which only sees a
# PR's own diff) by re-running the full CI plus full-dependency-tree scanners on a
# fixed weekly cadence, so a newly-disclosed CVE in an already-pinned, unchanged
# dependency is surfaced even when no code change triggers CI (#211). Findings open
# tracking issues.
on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Re-run the full CI suite (lint, typecheck, tests, build) on schedule.
  ci:
    name: CI
    permissions:
      contents: read
    # Not `secrets: inherit`, which hands the called workflow EVERY secret this
    # repository holds. ci.yml references exactly one.
    secrets:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    uses: ./.github/workflows/ci.yml

  # ── npm audit (production dependency tree) ────────────
  # Mirrors the release-time gate in frontend/Dockerfile, but on a schedule, so a
  # CVE newly disclosed against an already-shipped dependency is caught before the
  # next release rather than only at build time.
  npm-audit:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      # Same triage the image build uses (frontend/scripts/audit-gate.mjs): block
      # only on advisories that reach production AND have a non-breaking fix.
      # Accepted risks live in frontend/scripts/npm-audit-exceptions.json with a
      # rationale and a review date, so an advisory nobody can act on does not
      # open a fresh issue every Monday forever.
      - name: npm audit
        id: audit
        working-directory: frontend
        continue-on-error: true
        run: |
          npm audit --json --omit=dev > "$RUNNER_TEMP/frontend-audit.json" || true
          node scripts/audit-gate.mjs "$RUNNER_TEMP/frontend-audit.json" \
            --exceptions scripts/npm-audit-exceptions.json

      - name: Create issue on new vulnerabilities
        if: steps.audit.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = 'npm audit: production vulnerabilities found';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security,dependencies',
            });
            if (open.some(i => i.title.startsWith(marker))) {
              core.info('An open npm-audit issue already exists — skipping duplicate.');
              return;
            }
            const title = `${marker} — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## npm audit Report',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '`npm audit --omit=dev --audit-level=high` found fixable high/critical advisories in the production dependency tree. Review the workflow logs and open a reviewed PR to update the affected package(s) (the lockfile is the shipped integrity record — see #213).',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['security', 'dependencies'],
            });

  # ── OSV Vulnerability Scan (full lockfile) ────────────
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          # JSON so the triage step below can classify findings; it prints a
          # readable summary in place of the table.
          scan-args: |-
            --format=json
            --output=osv-results.json
            --lockfile=frontend/package-lock.json

      # Triaged through the same gate and the same exceptions file the npm-audit
      # job uses, so the two scanners cannot reach opposite conclusions about one
      # advisory. That matters here: OSV lists react-router's fix as 8.3.0, which
      # reads as "a fix exists", while npm audit correctly reports the same
      # advisory as fixable only by a breaking change. Without shared triage this
      # job would be red every week with no action anyone could take.
      - name: Triage OSV findings
        run: node frontend/scripts/audit-gate.mjs osv-results.json \
          --exceptions frontend/scripts/npm-audit-exceptions.json

      - name: Create issue on new vulnerabilities
        if: steps.osv.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = 'OSV-Scanner: vulnerabilities found';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'security,dependencies',
            });
            if (open.some(i => i.title.startsWith(marker))) {
              core.info('An open OSV-Scanner issue already exists — skipping duplicate.');
              return;
            }
            const title = `${marker} — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## OSV-Scanner Vulnerability Report',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'OSV-Scanner found known vulnerabilities in `frontend/package-lock.json`. Review the workflow logs and update the affected dependencies.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['security', 'dependencies'],
            });

  # ── CodeQL Analysis (JavaScript/TypeScript) ───────────
  codeql:
    name: CodeQL Analysis (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read # CodeQL reads workflow-run metadata (required on private repos)
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:javascript-typescript

  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    needs: [ci, npm-audit, osv-scan, codeql]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `Weekly security scan failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Weekly Security Scan Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The scheduled weekly security scan failed. Please investigate before the next release.',
              '',
              'Common causes:',
              '- A transitive npm dependency published a new CVE',
              '- The Docker base image (node/nginx) changed in a breaking way',
              '- An npm-audit or OSV-Scanner finding was introduced',
              '- CodeQL detected a new issue',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['bug', 'ci'],
            });
