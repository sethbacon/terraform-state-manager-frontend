---
name: Release Please

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      # NOTE: using the default GITHUB_TOKEN means the release PR will not trigger
      # other workflows (GitHub recursion prevention). Upgrading to a GitHub App
      # token (as the registry does) so CI runs on the release PR is a follow-up.
      - name: Run release-please
        # v5.0.0
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
