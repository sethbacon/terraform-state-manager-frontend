version: 2

# The shared suite UI package is public on npmjs, so the frontend tree needs no
# registry credentials. The package itself is still excluded from automated
# version updates below: it is released and pinned in lockstep with the suite,
# out of band.
updates:
  # ---------------------------------------------------------------------------
  # npm (frontend/) — public dependency tree
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    # Group public updates into one PR per cycle to reduce noise.
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Private, released and version-pinned in lockstep with the suite; not
      # auto-bumped here (resolved via the registry above only).
      - dependency-name: "@4cloudguru/*"
      # React major bumps are breaking and need manual review.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # Docker base images (frontend/Dockerfile: node builder + nginx runtime)
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # GitHub Actions (SHA-pinned uses: across .github/workflows and .github/actions)
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
