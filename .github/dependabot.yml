version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm (frontend/)
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: biweekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    # Group non-major updates into a single PR per cycle to reduce noise.
    groups:
      frontend-dependencies:
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: biweekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
