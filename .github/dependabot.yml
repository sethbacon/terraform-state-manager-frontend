version: 2

# The shared suite UI package is public on npmjs, so the frontend tree needs no
# registry credentials. The package itself is still excluded from automated
# version updates below: it is released and pinned in lockstep with the suite,
# out of band.
updates:
  # ---------------------------------------------------------------------------
  # npm (frontend/) — public dependency tree
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    # Group public updates into one PR per cycle to reduce noise.
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Public on npmjs and peer-only (zero runtime deps), so patch/minor can
      # flow like any other dependency — nothing else would ever surface a fix
      # in the shared UI here. Majors stay manual because its peerDependencies
      # pin the react/MUI/react-router ranges this app has to satisfy.
      - dependency-name: "@4cloudguru/*"
        update-types: ["version-update:semver-major"]
      # React major bumps are breaking and need manual review.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # typescript-eslint pins a supported TS range, so a TS major arrives before
      # the linter can parse it and breaks lint outright (TS 7 did exactly this).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # Docker base images (frontend/Dockerfile: node builder + nginx runtime)
  # ---------------------------------------------------------------------------
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    ignore:
      # The node builder major is tied to package.json `engines`; Dependabot has
      # no visibility of that, and the grouped bump in #255 silently moved it
      # 24 -> 26 without the major even appearing in the PR title. Digest and
      # minor updates still flow. Raise the major here and in `engines` together.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # GitHub Actions (SHA-pinned uses: across .github/workflows and .github/actions)
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # ---------------------------------------------------------------------------
  # npm (.github/commit-message-check: the parser the PR gate shares with
  # release-please)
  # ---------------------------------------------------------------------------
  # The gate is only meaningful while it parses the way release-please does, so
  # these bumps want checking against release-please's own dependency rather
  # than merging on green.
  - package-ecosystem: npm
    directory: /.github/commit-message-check
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      commit-message-check:
        patterns:
          - "*"
